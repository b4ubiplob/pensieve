<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register | Pensieve</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .font-headline {
            font-family: 'Manrope', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#1e293b",
                "surface": "#f8fafc",
                "surface-container": "#ffffff",
                "secondary": "#64748b",
                "accent": "#4f46e5",
                "outline": "#e2e8f0"
              },
              fontFamily: {
                "headline": ["Manrope", "sans-serif"],
                "body": ["Inter", "sans-serif"]
              },
              borderRadius: {
                "DEFAULT": "0.375rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "2xl": "1rem"
              },
            },
          },
        }
    </script>
</head>
<body class="bg-surface text-primary antialiased">
<!-- Navigation -->
<header class="w-full fixed top-0 left-0 bg-surface/80 backdrop-blur-md z-50 border-b border-outline/50">
<div class="flex justify-between items-center px-6 py-4 max-w-7xl mx-auto w-full">
<div class="text-xl font-extrabold tracking-tight font-headline flex items-center gap-2">
<span class="w-8 h-8 bg-primary text-white flex items-center justify-center rounded-lg">P</span>
<span>Pensieve</span>
</div>
<nav class="hidden md:flex gap-8 items-center">
<a class="text-sm font-semibold text-secondary hover:text-primary transition-colors" href="#">Explore</a>
<a class="text-sm font-semibold text-secondary hover:text-primary transition-colors" href="#">Architects</a>
<a class="text-sm font-bold text-accent" href="#">Sign In</a>
</nav>
<div class="md:hidden">
<span class="material-symbols-outlined">menu</span>
</div>
</div>
</header>
<main class="min-h-screen pt-24 pb-12 flex items-center justify-center px-4">
<div class="max-w-md w-full">
<!-- Header Text -->
<div class="text-center mb-10">
<h1 class="font-headline text-4xl font-extrabold tracking-tight text-primary mb-3">
                    Begin Your <span class="text-accent">Curation</span>
</h1>
<p class="text-secondary text-sm font-medium">
                    Join an exclusive studio for digital structural clarity.
                </p>
</div>
<!-- Registration Card -->
<div class="bg-surface-container rounded-2xl p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-outline/50">
<form action="#" class="space-y-6">
<!-- Avatar Upload -->
<div class="flex flex-col items-center space-y-3 mb-8">
<div class="relative group">
<div class="w-24 h-24 rounded-2xl bg-slate-50 border-2 border-dashed border-outline flex items-center justify-center overflow-hidden hover:border-accent transition-colors">
<span class="material-symbols-outlined text-4xl text-slate-300 group-hover:text-accent">account_circle</span>
<input aria-label="Upload Profile Picture" class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
<div class="absolute -bottom-2 -right-2 bg-primary text-white rounded-lg p-1.5 shadow-md">
<span class="material-symbols-outlined text-xs" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
</div>
<div class="text-center">
<p class="text-xs font-bold text-primary uppercase tracking-wider">Upload Profile Picture</p>
<p class="text-[10px] text-secondary mt-1">SVG, PNG, or JPG (max. 2MB)</p>
</div>
</div>
<!-- Fields -->
<div class="space-y-4">
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-widest text-secondary ml-1">Full Name</label>
<input class="w-full bg-slate-50 border-outline rounded-xl px-4 py-3 text-sm text-primary placeholder:text-slate-400 focus:ring-2 focus:ring-accent/20 focus:border-accent transition-all outline-none" placeholder="Julianne Moore" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-widest text-secondary ml-1">Username</label>
<input class="w-full bg-slate-50 border-outline rounded-xl px-4 py-3 text-sm text-primary placeholder:text-slate-400 focus:ring-2 focus:ring-accent/20 focus:border-accent transition-all outline-none" placeholder="j.moore_studio" type="text"/>
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-widest text-secondary ml-1">Email Address</label>
<input class="w-full bg-slate-50 border-outline rounded-xl px-4 py-3 text-sm text-primary placeholder:text-slate-400 focus:ring-2 focus:ring-accent/20 focus:border-accent transition-all outline-none" placeholder="julianne@pensieve.com" type="email"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-widest text-secondary ml-1">Password</label>
<input class="w-full bg-slate-50 border-outline rounded-xl px-4 py-3 text-sm text-primary placeholder:text-slate-400 focus:ring-2 focus:ring-accent/20 focus:border-accent transition-all outline-none" placeholder="••••••••" type="password"/>
</div>
<div class="space-y-1.5">
<label class="text-[11px] font-bold uppercase tracking-widest text-secondary ml-1">Confirm</label>
<input class="w-full bg-slate-50 border-outline rounded-xl px-4 py-3 text-sm text-primary placeholder:text-slate-400 focus:ring-2 focus:ring-accent/20 focus:border-accent transition-all outline-none" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- CTA -->
<div class="pt-2">
<button class="w-full py-4 px-6 rounded-xl bg-primary text-white font-headline font-bold text-sm tracking-wide shadow-lg shadow-primary/10 hover:bg-slate-800 active:scale-[0.98] transition-all" type="submit">
                            Create Account
                        </button>
</div>
<!-- Footer Link -->
<div class="text-center pt-2">
<p class="text-secondary text-xs font-medium">
                            Already have an account? 
                            <a class="text-accent font-bold hover:underline transition-all ml-1" href="#">Sign In</a>
</p>
</div>
</form>
</div>
</div>
</main>
<footer class="w-full bg-surface border-t border-outline/30">
<div class="flex flex-col md:flex-row justify-between items-center px-6 py-8 w-full max-w-7xl mx-auto">
<div class="text-[10px] font-bold uppercase tracking-widest text-secondary/60 mb-4 md:mb-0">
                © 2024 Pensieve Architectural Curator.
            </div>
<div class="flex flex-wrap justify-center gap-6">
<a class="text-[10px] font-bold uppercase tracking-widest text-secondary/60 hover:text-accent transition-colors" href="#">Privacy</a>
<a class="text-[10px] font-bold uppercase tracking-widest text-secondary/60 hover:text-accent transition-colors" href="#">Terms</a>
<a class="text-[10px] font-bold uppercase tracking-widest text-secondary/60 hover:text-accent transition-colors" href="#">Support</a>
</div>
</div>
</footer>
</body></html>
